<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F0FF"/>
      <stop offset="1" stop-color="#F5F9FF"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#0B2170"/>
    </linearGradient>
    <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B6BF5"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2170" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="520" rx="28" fill="url(#sky)"/>

  <!-- background skyline -->
  <g fill="#C9D8FF">
    <rect x="30" y="250" width="60" height="150" rx="4"/>
    <rect x="100" y="210" width="44" height="190" rx="4"/>
    <rect x="520" y="230" width="50" height="170" rx="4"/>
    <rect x="575" y="270" width="40" height="130" rx="4"/>
  </g>

  <!-- hospital -->
  <g filter="url(#shadow)">
    <rect x="300" y="130" width="200" height="270" rx="10" fill="url(#bldg)"/>
    <rect x="230" y="220" width="90" height="180" rx="8" fill="url(#bldg2)"/>
    <rect x="480" y="200" width="70" height="200" rx="8" fill="url(#bldg2)"/>
  </g>
  <!-- cross sign -->
  <rect x="368" y="92" width="64" height="64" rx="14" fill="#ffffff"/>
  <rect x="392" y="102" width="16" height="44" rx="3" fill="#EF4444"/>
  <rect x="378" y="116" width="44" height="16" rx="3" fill="#EF4444"/>
  <!-- windows -->
  <g fill="#93C5FD" opacity="0.9">
    <rect x="322" y="180" width="30" height="22" rx="3"/><rect x="385" y="180" width="30" height="22" rx="3"/><rect x="448" y="180" width="30" height="22" rx="3"/>
    <rect x="322" y="222" width="30" height="22" rx="3"/><rect x="385" y="222" width="30" height="22" rx="3" fill="#5EEAD4"/><rect x="448" y="222" width="30" height="22" rx="3"/>
    <rect x="322" y="264" width="30" height="22" rx="3" fill="#5EEAD4"/><rect x="385" y="264" width="30" height="22" rx="3"/><rect x="448" y="264" width="30" height="22" rx="3"/>
    <rect x="322" y="306" width="30" height="22" rx="3"/><rect x="448" y="306" width="30" height="22" rx="3" fill="#5EEAD4"/>
    <rect x="245" y="245" width="24" height="18" rx="3"/><rect x="282" y="245" width="24" height="18" rx="3"/>
    <rect x="245" y="285" width="24" height="18" rx="3" fill="#5EEAD4"/><rect x="282" y="285" width="24" height="18" rx="3"/>
    <rect x="245" y="325" width="24" height="18" rx="3"/><rect x="282" y="325" width="24" height="18" rx="3"/>
    <rect x="495" y="225" width="40" height="18" rx="3"/><rect x="495" y="265" width="40" height="18" rx="3" fill="#5EEAD4"/><rect x="495" y="305" width="40" height="18" rx="3"/>
  </g>
  <!-- ER entrance -->
  <rect x="370" y="345" width="60" height="55" rx="4" fill="#E0EAFF"/>
  <rect x="352" y="334" width="96" height="16" rx="4" fill="#EF4444"/>
  <text x="400" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#ffffff">EMERGENCY</text>

  <!-- ground / road -->
  <rect x="0" y="400" width="640" height="120" fill="#DCE6FA"/>
  <rect x="0" y="440" width="640" height="44" fill="#1F2A4A"/>
  <g fill="#ffffff" opacity="0.8">
    <rect x="20" y="460" width="40" height="5" rx="2"/><rect x="100" y="460" width="40" height="5" rx="2"/>
    <rect x="180" y="460" width="40" height="5" rx="2"/><rect x="260" y="460" width="40" height="5" rx="2"/>
    <rect x="340" y="460" width="40" height="5" rx="2"/><rect x="420" y="460" width="40" height="5" rx="2"/>
    <rect x="500" y="460" width="40" height="5" rx="2"/><rect x="580" y="460" width="40" height="5" rx="2"/>
  </g>
  <rect x="0" y="484" width="640" height="36" fill="#E8EFFC"/>

  <!-- ambulance -->
  <g transform="translate(40 362)" filter="url(#shadow)">
    <path d="M0 20 Q0 8 12 8 H120 V92 H0 Z" fill="#ffffff"/>
    <path d="M120 30 H160 Q172 30 178 42 L196 70 V92 H120 Z" fill="#F8FAFF"/>
    <path d="M132 40 H158 Q164 40 167 46 L178 66 H132 Z" fill="#93C5FD"/>
    <rect x="0" y="56" width="196" height="9" fill="#EF4444"/>
    <rect x="48" y="24" width="12" height="32" rx="2" fill="#EF4444"/>
    <rect x="38" y="34" width="32" height="12" rx="2" fill="#EF4444"/>
    <rect x="86" y="0" width="22" height="10" rx="3" fill="#3B82F6"/>
    <rect x="86" y="0" width="11" height="10" rx="3" fill="#EF4444"/>
    <circle cx="40" cy="94" r="16" fill="#1F2A4A"/><circle cx="40" cy="94" r="6" fill="#CBD5E1"/>
    <circle cx="152" cy="94" r="16" fill="#1F2A4A"/><circle cx="152" cy="94" r="6" fill="#CBD5E1"/>
  </g>

  <!-- signal waves from ambulance to hospital -->
  <g fill="none" stroke="url(#wave)" stroke-width="4" stroke-linecap="round">
    <path d="M140 330 Q 150 315 165 312" opacity="0.9"/>
    <path d="M130 312 Q 150 285 180 282" opacity="0.7"/>
    <path d="M120 294 Q 150 255 195 252" opacity="0.5"/>
  </g>
  <path d="M200 250 C 260 200, 300 150, 360 120" fill="none" stroke="#14B8A6" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round"/>

  <!-- notification card -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="210" height="112" rx="16" fill="#ffffff"/>
  </g>
  <circle cx="68" cy="100" r="14" fill="#FEE2E2"/>
  <circle cx="68" cy="100" r="5" fill="#EF4444"/>
  <text x="92" y="97" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#0B1B4A">Incoming · ETA 7 min</text>
  <text x="92" y="114" font-family="Arial, sans-serif" font-size="11" fill="#64748B">Trauma · Priority 1</text>
  <rect x="56" y="132" width="56" height="20" rx="10" fill="#CCFBF1"/>
  <text x="84" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#0F766E">Bed ✓</text>
  <rect x="118" y="132" width="56" height="20" rx="10" fill="#CCFBF1"/>
  <text x="146" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#0F766E">Rx ✓</text>
  <rect x="180" y="132" width="56" height="20" rx="10" fill="#DBEAFE"/>
  <text x="208" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#1D4ED8">OR …</text>
  <rect x="56" y="162" width="180" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="56" y="162" width="128" height="6" rx="3" fill="#14B8A6"/>
</svg>
