<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060D1C" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#0F2347" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#123A73" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.78" cy="0.28" r="0.45">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.12" cy="0.9" r="0.4">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="ecg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#5EEAD4" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#5EEAD4" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- concentric radar rings -->
  <g fill="none" stroke="#99F6E4" stroke-opacity="0.12">
    <circle cx="1240" cy="300" r="140"/>
    <circle cx="1240" cy="300" r="240"/>
    <circle cx="1240" cy="300" r="360"/>
    <circle cx="1240" cy="300" r="500"/>
  </g>

  <!-- large soft cross -->
  <g opacity="0.07" fill="#ffffff">
    <rect x="1350" y="560" width="70" height="210" rx="16"/>
    <rect x="1280" y="630" width="210" height="70" rx="16"/>
  </g>
  <g opacity="0.06" fill="#ffffff">
    <rect x="140" y="120" width="34" height="100" rx="8"/>
    <rect x="107" y="153" width="100" height="34" rx="8"/>
  </g>

  <!-- ECG line -->
  <g transform="translate(0 170)" opacity="0.35">
  <path d="M0 720 H420 L450 720 L470 690 L490 750 L520 600 L555 810 L585 700 L605 720 H900 L925 720 L945 695 L965 745 L995 620 L1025 790 L1050 705 L1070 720 H1600"
        fill="none" stroke="url(#ecg)" stroke-width="10" stroke-linejoin="round" filter="url(#blur)" opacity="0.6"/>
  <path d="M0 720 H420 L450 720 L470 690 L490 750 L520 600 L555 810 L585 700 L605 720 H900 L925 720 L945 695 L965 745 L995 620 L1025 790 L1050 705 L1070 720 H1600"
        fill="none" stroke="url(#ecg)" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- data nodes -->
  <g fill="#5EEAD4">
    <circle cx="1240" cy="300" r="5"/>
    <circle cx="1020" cy="170" r="3" opacity="0.7"/>
    <circle cx="1460" cy="120" r="3" opacity="0.7"/>
    <circle cx="1480" cy="420" r="4" opacity="0.8"/>
    <circle cx="980" cy="440" r="3" opacity="0.6"/>
  </g>
  <g stroke="#5EEAD4" stroke-opacity="0.25" stroke-dasharray="4 6">
    <line x1="1240" y1="300" x2="1020" y2="170"/>
    <line x1="1240" y1="300" x2="1460" y2="120"/>
    <line x1="1240" y1="300" x2="1480" y2="420"/>
    <line x1="1240" y1="300" x2="980" y2="440"/>
  </g>
</svg>
